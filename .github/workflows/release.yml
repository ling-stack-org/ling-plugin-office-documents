name: Plugin release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
          - platform: win32
            arch: x64
    runs-on: ${{ matrix.platform == 'darwin' && 'macos-14' || 'windows-2025' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Package plugin
        env:
          LING_PLUGIN_ARTIFACT_PRIVATE_KEY: ${{ secrets.LING_PLUGIN_ARTIFACT_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: corepack pnpm run package:${{ matrix.platform == 'darwin' && 'mac' || 'win' }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
