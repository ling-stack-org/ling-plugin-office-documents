name: Plugin candidates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            runner: macos-26
            system: darwin-arm64
          - target: win
            runner: windows-2025
            system: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        if: matrix.target == 'win'
        with:
          dotnet-version: 8.0.x
      - run: corepack pnpm check
      - name: Build and verify candidate
        run: corepack pnpm package:${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugin-${{ matrix.system }}
          path: dist/packages/*
          if-no-files-found: error
